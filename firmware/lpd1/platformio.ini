; LPD-1: the DMX engine (lib/engine) and, later, the box around it.
;   python -m platformio test -e native     replay the LPU recordings (lpd/replay)
;   python -m platformio run -e wt32-eth01  build for the box (compile check for now)
; The native tests need gcc (WinLibs MinGW-w64 on this PC).

[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -std=gnu++17 -O2

; the VN server + engine as a Windows program (src/pc; milestone 2)
[env:pc]
platform = native
build_src_filter = -<*> +<pc/>
build_flags = -std=gnu++17 -O2 -lws2_32 -lwinmm

[env:wt32-eth01]
platform = espressif32 @ 6.9.0
build_src_filter = +<*> -<pc/>
board = wt32-eth01
framework = arduino
; the show is saved in LittleFS (4 MB: 2 x 1.25 MB app + 1.375 MB files)
board_build.filesystem = littlefs
board_build.partitions = default.csv
monitor_speed = 115200
; DMX out pins (FIRST_FLASH.md): WLED's default is TX on GPIO2 and no enable
; pin (-1: the MAX485's DE / RE wired for sending). Set them to the PCB's.
build_flags =
  -D LPD_DMX_TX_PIN=2
  -D LPD_DMX_EN_PIN=-1
  '-D LPD_OTA_PASSWORD="${sysenv.LPD_OTA_PASSWORD}"'

; the same, flashed over the network (ArduinoOTA; FIRST_FLASH.md 6):
;   python -m platformio run -e wt32-eth01-ota -t upload [--upload-port IP]
; with the same LPD_OTA_PASSWORD in the environment as at the last flash
[env:wt32-eth01-ota]
extends = env:wt32-eth01
upload_protocol = espota
upload_port = 192.168.1.102
upload_flags = --auth=${sysenv.LPD_OTA_PASSWORD}
