; DLED bridge: the light DLED page + the LPU bridge on a WT32-ETH01 (4 MB).
;
;   python -m platformio run -t upload     firmware (USB-serial adapter, IO0 to GND at reset)
;   python -m platformio run -t uploadfs   the page (build it first: dart run tool/build_light.dart
;                                          in dled_flutter; files come from light/dist)
;   python -m platformio device monitor    log at 115200 baud
;
; Over the network, once the box runs firmware with OTA (flashed by serial
; once; src/main.cpp):
;   python -m platformio run -e wt32-eth01-ota -t upload [--upload-port IP]
;                                          firmware (ArduinoOTA, no password)
;   python upload_page.py [IP]             the page (light/dist), file by file;
;                                          the saved shows stay
; Never `-t uploadfs` over the network or by serial on a box in use: it
; replaces the whole file system, the saved shows (/shows) too.

[platformio]
default_envs = wt32-eth01
data_dir = ../../dled_flutter/light/dist

[env:wt32-eth01]
platform = espressif32 @ 6.9.0
board = wt32-eth01
framework = arduino
board_build.filesystem = littlefs
; 4 MB: 2 x 1.25 MB app (OTA) + 1.375 MB file system
board_build.partitions = default.csv
monitor_speed = 115200
lib_deps =
  mathieucarbou/AsyncTCP @ 3.3.2
  mathieucarbou/ESPAsyncWebServer @ 3.6.0
build_flags =
  -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
  -D WS_MAX_QUEUED_MESSAGES=64

; the same, flashed over the network (ArduinoOTA)
[env:wt32-eth01-ota]
extends = env:wt32-eth01
upload_protocol = espota
upload_port = dled.local
